  <text x="800" y="160" text-anchor="middle" font-size="18" fill="#93A6CE" letter-spacing="3">9 个模型 · 5 家厂商</text>
  <rect x="755" y="184" width="90" height="4" rx="2" fill="url(#accentGrad)"/>

