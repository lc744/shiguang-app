<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1122"/>
      <stop offset="0.55" stop-color="#111B36"/>
      <stop offset="1" stop-color="#0A0F20"/>
    </linearGradient>
    <radialGradient id="gBlue">
      <stop offset="0" stop-color="#3B6BFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPurple">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gTeal">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
