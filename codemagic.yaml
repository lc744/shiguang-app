# Codemagic 构建配置 —— 拾光 iOS 版
# 文档: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# 使用方法：
# 1. 注册 https://codemagic.io （GitHub 账号登录，每月免费 500 分钟）
# 2. Add new application → 选择 GitHub 仓库
# 3. Codemagic 会自动读取本文件开始构建
#
# 签名说明（二选一）：
# A. 无 Apple 开发者账号 → 用 "ios-unsigned" 工作流（验证编译，产出 .app）
# B. 有 Apple 开发者账号（$99/年）→ 配置证书后用 "ios-release-signed" 工作流

workflows:
  # ---------- 工作流 1：无签名构建（无需任何 Apple 账号）----------
  ios-unsigned:
    name: 拾光 iOS 无签名构建
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: 安装 npm 依赖
        script: npm ci

      - name: 同步 Capacitor iOS 资源（webDir + JS/CSS）
        script: |
          npx cap sync ios --skip-loading-plugins
          # Windows 生成的 Package.swift 可能带反斜杠路径，macOS 必须是正斜杠
          sed -i '' 's#\\#/#g' ios/App/CapApp-SPM/Package.swift || sed -i 's#\\#/#g' ios/App/CapApp-SPM/Package.swift
          echo "--- Package.swift 校验 ---"
          grep "local-notifications" ios/App/CapApp-SPM/Package.swift
          echo "✓ Web assets synced"

      - name: 解析 SPM 依赖
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: 使用 Xcodebuild 构建（无签名）
        script: |
          cd ios/App
          set -o pipefail
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build \
            -derivedDataPath $CM_BUILD_DIR/dd \
            2>&1 | tail -150

      - name: 打包 .app 为可下载产物
        script: |
          cd $CM_BUILD_DIR/build
          ls -la
          if ls *.app >/dev/null 2>&1; then
            zip -r 拾光-unsigned.zip *.app
          else
            echo "!! CONFIGURATION_BUILD_DIR 下没有 .app，搜索 DerivedData ..."
            find $CM_BUILD_DIR/dd -name "App.app" -type d | head -3
            APP_PATH=$(find $CM_BUILD_DIR/dd -name "App.app" -type d | head -1)
            if [ -n "$APP_PATH" ]; then
              cd "$(dirname "$APP_PATH")"
              zip -r $CM_BUILD_DIR/build/拾光-unsigned.zip App.app
            fi
          fi
    artifacts:
      - $CM_BUILD_DIR/build/*.zip
    publishing:
      email:
        recipients:
          - 2835112874@qq.com

  # ---------- 工作流 2：签名发布（需配置证书）----------
  ios-release-signed:
    name: 拾光 iOS 签名发布
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      # 在 Codemagic 界面: Code signing → iOS 上传证书后取消注释
      # ios_signing:
      #   distribution_type: ad_hoc
      #   bundle_identifier: com.shiguang.reminder
    scripts:
      - name: 安装 npm 依赖
        script: npm ci

      - name: 同步 Capacitor iOS 资源
        script: |
          npx cap sync ios --skip-loading-plugins
          sed -i '' 's#\\#/#g' ios/App/CapApp-SPM/Package.swift || sed -i 's#\\#/#g' ios/App/CapApp-SPM/Package.swift

      - name: 解析 SPM 依赖
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: 构建 Archive
        script: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/shiguang.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath $CM_BUILD_DIR/dd

      - name: 导出 IPA
        script: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>YOUR_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/shiguang.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      email:
        recipients:
          - 2835112874@qq.com
