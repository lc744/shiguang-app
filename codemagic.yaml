# Codemagic 构建配置 —— 拾光 iOS 版
# 文档: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# 使用方法：
# 1. 注册 https://codemagic.io （GitHub 账号登录，每月免费 500 分钟）
# 2. Add new application → 选择 GitHub 仓库
# 3. Codemagic 会自动读取本文件开始构建
#
# 签名说明（二选一）：
# A. 无 Apple 开发者账号 → 用 "ios-unsigned" 工作流（验证编译，产出 .app）
# B. 有 Apple 开发者账号（$99/年）→ 配置证书后用 "ios-release-signed" 工作流

workflows:
  # ---------- 工作流 1：无签名构建（无需任何 Apple 账号）----------
  ios-unsigned:
    name: 拾光 iOS 无签名构建
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: 安装 npm 依赖
        script: npm ci

      - name: 构建 Web 资源（生成 www/）
        script: |
          set -e
          node build-www.js
          test -f www/index.html || { echo "❌ www/index.html 未生成"; exit 1; }
          echo "✓ www/ 构建完成"

      - name: 同步 Capacitor iOS 资源（www → public/）
        script: |
          set -e
          npx cap sync ios
          # Windows 生成的 Package.swift 可能带反斜杠路径，macOS 必须是正斜杠
          sed -i '' 's#\\#/#g' ios/App/CapApp-SPM/Package.swift 2>/dev/null || sed -i 's#\\#/#g' ios/App/CapApp-SPM/Package.swift
          # 关键验证：public/index.html 必须存在（cap sync 的 copy 失败会被 CLI 静默吞掉，必须显式检查）
          test -f ios/App/App/public/index.html || { echo "❌ ios/App/App/public/index.html 不存在 —— cap sync 实际失败了"; exit 1; }
          ls ios/App/App/public/
          echo "✓ Web assets synced"

      - name: 解析 SPM 依赖
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: 使用 Xcodebuild 构建（无签名）
        script: |
          cd ios/App
          set -o pipefail
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build \
            -derivedDataPath $CM_BUILD_DIR/dd \
            2>&1 | tail -150

      - name: 打包 .app 为可下载产物
        script: |
          cd $CM_BUILD_DIR/build
          ls -la
          if ls *.app >/dev/null 2>&1; then
            zip -r 拾光-unsigned.zip *.app
          else
            echo "!! CONFIGURATION_BUILD_DIR 下没有 .app，搜索 DerivedData ..."
            find $CM_BUILD_DIR/dd -name "App.app" -type d | head -3
            APP_PATH=$(find $CM_BUILD_DIR/dd -name "App.app" -type d | head -1)
            if [ -n "$APP_PATH" ]; then
              cd "$(dirname "$APP_PATH")"
              zip -r $CM_BUILD_DIR/build/拾光-unsigned.zip App.app
            fi
          fi
    artifacts:
      - $CM_BUILD_DIR/build/*.zip
    publishing:
      email:
        recipients:
          - 2835112874@qq.com

  # ---------- 工作流 2：签名发布（需配置证书）----------
  ios-release-signed:
    name: 拾光 iOS 签名发布
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      # 在 Codemagic 界面: Code signing → iOS 上传证书后取消注释
      # ios_signing:
      #   distribution_type: ad_hoc
      #   bundle_identifier: com.shiguang.reminder
    scripts:
      - name: 安装 npm 依赖
        script: npm ci

      - name: 构建 Web 资源（生成 www/）
        script: |
          set -e
          node build-www.js
          test -f www/index.html || { echo "❌ www/index.html 未生成"; exit 1; }

      - name: 同步 Capacitor iOS 资源
        script: |
          set -e
          npx cap sync ios
          sed -i '' 's#\\#/#g' ios/App/CapApp-SPM/Package.swift 2>/dev/null || sed -i 's#\\#/#g' ios/App/CapApp-SPM/Package.swift
          test -f ios/App/App/public/index.html || { echo "❌ ios/App/App/public/index.html 不存在 —— cap sync 实际失败了"; exit 1; }

      - name: 解析 SPM 依赖
        script: |
          cd ios/App
          xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      - name: 构建 Archive
        script: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/shiguang.xcarchive \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath $CM_BUILD_DIR/dd

      - name: 导出 IPA
        script: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>YOUR_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/shiguang.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      email:
        recipients:
          - 2835112874@qq.com
