# Codemagic 构建配置 —— 拾光 iOS 版
# 文档: https://docs.codemagic.io/yaml/yaml-getting-started/
#
# 使用方法：
# 1. 注册 https://codemagic.io （GitHub 账号登录，每月免费 500 分钟）
# 2. Add new application → 选择 GitHub 仓库
# 3. Codemagic 会自动读取本文件开始构建
#
# 签名说明（二选一）：
# A. 无 Apple 开发者账号 → 用 "unsigned" 工作流（验证编译，产出 .app）
# B. 有 Apple 开发者账号（$99/年）→ 在 Codemagic 界面:
#    Teams → Applications → (你的应用) → Code signing → iOS
#    上传 distribution 证书 (.p12) 和 provisioning profile
#    或配置 App Store Connect API key 实现全自动签名
#    然后选 "release-signed" 工作流

workflows:
  # ---------- 工作流 1：无签名构建（无需任何 Apple 账号）----------
  ios-unsigned:
    name: 拾光 iOS 无签名构建
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: 安装 npm 依赖
        script: npm ci
      - name: 同步 Capacitor iOS 资源
        script: npx cap sync ios
      - name: 构建（无签名）
        script: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=$CM_BUILD_DIR/build
      - name: 打包 .app 为可下载产物
        script: |
          cd $CM_BUILD_DIR/build
          zip -r 拾光-unsigned.zip *.app
    artifacts:
      - $CM_BUILD_DIR/build/*.zip
    publishing:
      email:
        recipients:
          - 2835112874@qq.com

  # ---------- 工作流 2：签名发布（需配置证书）----------
  ios-release-signed:
    name: 拾光 iOS 签名发布
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      # 自动签名配置（在 Codemagic 界面上传证书后取消注释）
      # ios_signing:
      #   distribution_type: app_store   # 或 ad_hoc
      #   bundle_identifier: com.shiguang.reminder
    scripts:
      - name: 安装 npm 依赖
        script: npm ci
      - name: 同步 Capacitor iOS 资源
        script: npx cap sync ios
      - name: 构建 Archive
        script: |
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/拾光.xcarchive \
            archive
      - name: 导出 IPA
        script: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>YOUR_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF
          # ↑ teamID 改成你的 Apple 开发者 Team ID（会员中心右侧可查）
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/拾光.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/ipa
    artifacts:
      - $CM_BUILD_DIR/ipa/*.ipa
    publishing:
      email:
        recipients:
          - 2835112874@qq.com
